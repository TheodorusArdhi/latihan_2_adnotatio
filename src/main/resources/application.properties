spring.application.name=adnotatio

#data source
spring.datasource.url=jdbc:postgresql://localhost:5432/adnotatio
spring.datasource.username=postgres
spring.datasource.password=postgres

#driver
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# KONFIGURASI DDL AUTO (GENERASI TABEL OTOMATIS)
spring.jpa.hibernate.ddl-auto=create-drop

# KONFIGURASI DEBUGGING / LOGGING SQL
# Tampilkan query SQL mentah di konsol
spring.jpa.show-sql=true

# Memformat tampilan SQL agar rapi dan mudah dibaca di konsol
spring.jpa.properties.hibernate.format_sql=true

# Menampilkan nilai parameter/variabel dari query SQL (opsional tapi sangat berguna)
logging.level.org.hibernate.orm.jdbc.bind=trace

#insert data dummy
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true